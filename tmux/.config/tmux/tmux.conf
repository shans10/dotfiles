### New Default-Like Catppuccin Mocha Status Bar ###
# Basic status bar style
set -g status-style bg="#1e1e2e",fg="#cdd6f4"
set -g status-justify left

# Left side: [#S] (displays session name).
# Signals when prefix is active by changing [S] to <S> and coloring it yellow/bold.
set -g status-left "#{?client_prefix,#[fg=#f9e2af#,bold]<#S> ,#[fg=#a6e3a1][#S] }"
set -g status-left-length 40

# Right side: current working directory (basename) in quotes, 12-hour clock (AM/PM), day-month-year (with 2 spaces of spacing)
set -g status-right " #[fg=#89b4fa]\"#{b:pane_current_path}\"  #[fg=#b4befe]%I:%M %p"
set -g status-right-length 150

# Window list format: #I:#W#F (index:name flags)
set -g window-status-separator " "
set -g window-status-format "#[fg=#a6adc8]#I:#W#F"
set -g window-status-current-format "#[fg=#89b4fa,bold]#I:#W#F"

# UI Colors
set -g message-style "bg=#f9e2af,fg=#1e1e2e,bold"
set -g message-command-style "bg=#f9e2af,fg=#1e1e2e,bold"
set -g prompt-cursor-colour "#89b4fa"
set -g prompt-cursor-style block
set -g mode-style "bg=#cba6f7,fg=#1e1e2e,bold" # Selection highlight
set -g copy-mode-match-style "bg=#313244,fg=#cdd6f4"
set -g copy-mode-current-match-style "bg=#f9e2af,fg=#1e1e2e,bold"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

### PLUGIN MANAGER ###
#
# Download TPM and plugins if not found
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Set TPM plugins directory
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"
